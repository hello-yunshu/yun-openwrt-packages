name: build-packages

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: "25.12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_generic
        package:
          - name: luci-app-nginx-manager
            repo: https://github.com/hello-yunshu/luci-app-nginx-manager.git
            ref: 3f3bf4dbf5d90b9c69ffb6565eea79c4205bf948
            path: .
          - name: luci-app-cloudflare-ip
            repo: https://github.com/hello-yunshu/luci-app-cloudflare-ip.git
            ref: b674b6e6a2cd50e20dcbfde0d620b2de5a9b30dd
            path: package/luci-app-cloudflare-ip
          - name: luci-app-upnp-nat-relay
            repo: https://github.com/hello-yunshu/luci-app-upnp-nat-relay.git
            ref: d8a3a9e9a9a37403fd1086315409d91a5c04a67c
            path: package/luci-app-upnp-nat-relay
          - name: luci-app-openclash
            repo: https://github.com/vernesong/OpenClash.git
            ref: e553e82e01c697aefbe1555261a503f425e00ccd
            path: luci-app-openclash
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-v25.12.0
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Update feeds and install build dependency
        working-directory: /builder
        run: |
          git config --global http.version HTTP/1.1
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base

      - name: Prepare package source
        working-directory: /builder
        env:
          PKG_REPO: ${{ matrix.package.repo }}
          PKG_REF: ${{ matrix.package.ref }}
          PKG_NAME: ${{ matrix.package.name }}
          PKG_PATH: ${{ matrix.package.path }}
        run: |
          rm -rf /tmp/src
          git init -q /tmp/src
          git -C /tmp/src remote add origin "$PKG_REPO"
          # 先浅取指定提交；部分仓库全量历史很大（如 OpenClash），浅取能省掉十几分钟
          if ! git -C /tmp/src fetch -q --depth 1 origin "$PKG_REF"; then
            git -C /tmp/src fetch -q origin "$PKG_REF"
          fi
          git -C /tmp/src checkout -q --detach FETCH_HEAD
          rm -rf "package/$PKG_NAME"
          mkdir -p "package/$PKG_NAME"
          cp -a "/tmp/src/$PKG_PATH/." "package/$PKG_NAME/"
          test -f "package/$PKG_NAME/Makefile"
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' "package/$PKG_NAME/Makefile"

      - name: Configure
        working-directory: /builder
        run: |
          echo "CONFIG_PACKAGE_${{ matrix.package.name }}=y" >> .config
          make defconfig </dev/null

      - name: Prepare signing keys
        working-directory: /builder
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          printf '%s' "$APK_PRIVATE_KEY" | base64 -d > private-key.pem
          chmod 600 private-key.pem
          test -s private-key.pem
          head -1 private-key.pem | grep -q 'BEGIN .*PRIVATE KEY'
          mkdir -p "$RUNNER_TEMP/keys"
          cp "$GITHUB_WORKSPACE/keys/yun-feed.rsa.pub" "$RUNNER_TEMP/keys/"
          grep -q 'BEGIN PUBLIC KEY' "$RUNNER_TEMP/keys/yun-feed.rsa.pub"
          echo "private key bytes: $(wc -c < private-key.pem)"

      - name: Enable per-package signing
        working-directory: /builder
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path('include/package-pack.mk')
          s = p.read_text()
          needle = '\t  --files "$$(IDIR_$(1))" \\\n'
          if needle not in s:
              sys.exit('package-pack.mk: mkpkg --files line not found')
          if 'private-key.pem' in s:
              sys.exit('package-pack.mk: already patched')
          s = s.replace(needle, needle + '\t  --sign "$(TOPDIR)/private-key.pem" \\\n', 1)
          p.write_text(s)
          PY
          grep -n -B1 -A1 'private-key.pem' include/package-pack.mk

      - name: Build po2lmo host tool
        working-directory: /builder
        run: |
          make package/feeds/luci/luci-base/host/compile V=s -j"$(nproc)" </dev/null
          test -x staging_dir/hostpkg/bin/po2lmo
          echo "po2lmo present"

      - name: Build package
        working-directory: /builder
        run: |
          make "package/${{ matrix.package.name }}/compile" V=s -j"$(nproc)" </dev/null

      - name: Verify lmo inside staged package tree
        working-directory: /builder
        env:
          PKG_NAME: ${{ matrix.package.name }}
        run: |
          set -e
          if ! find "package/$PKG_NAME" -maxdepth 2 -type d -name po | grep -q .; then
            echo "package ships no translations, skipping lmo check"
            exit 0
          fi
          LMO=$(find build_dir -path "*$PKG_NAME*" -name '*.lmo')
          echo "$LMO"
          test -n "$LMO"

      - name: Verify signatures and collect package
        working-directory: /builder
        env:
          PKG_NAME: ${{ matrix.package.name }}
        run: |
          set -e
          APK_BIN=staging_dir/host/bin/apk
          test -x "$APK_BIN"
          OUT="$RUNNER_TEMP/out/${{ matrix.arch }}"
          mkdir -p "$OUT"
          find bin/packages -name "$PKG_NAME-[0-9]*.apk" -exec cp -v {} "$OUT/" \;
          test -n "$(ls "$OUT"/*.apk)"
          for f in "$OUT"/*.apk; do
            "$APK_BIN" --keys-dir "$RUNNER_TEMP/keys" verify "$f"
          done
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}-${{ matrix.package.name }}
          path: ${{ runner.temp }}/out/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openwrt/sdk:x86_64-v25.12.0
      options: --user root
    # sdk 镜像自带 WORKDIR /builder，不显式指定就会在 /builder 里落盘/提交
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: ${{ runner.temp }}/artifacts

      - name: Rebuild signed indexes
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          printf '%s' "$APK_PRIVATE_KEY" | base64 -d > "$RUNNER_TEMP/private-key.pem"
          chmod 600 "$RUNNER_TEMP/private-key.pem"
          APK_BIN=/builder/staging_dir/host/bin/apk
          KEYS_DIR="$GITHUB_WORKSPACE/keys"
          for arch in x86_64 aarch64_generic; do
            mkdir -p "$GITHUB_WORKSPACE/$arch"
            find "$RUNNER_TEMP/artifacts" -path "*/pkg-$arch-*/*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/$arch/" \;
            for f in "$GITHUB_WORKSPACE/$arch"/*.apk; do
              "$APK_BIN" --keys-dir "$KEYS_DIR" verify "$f"
            done
            "$APK_BIN" mkndx --allow-untrusted --keys-dir "$KEYS_DIR" \
              --sign-key "$RUNNER_TEMP/private-key.pem" \
              --output "$GITHUB_WORKSPACE/$arch/packages.adb" "$GITHUB_WORKSPACE/$arch"/*.apk
            ls -l "$GITHUB_WORKSPACE/$arch"
          done

      - name: Commit published packages
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          pwd
          # checkout 以 runner 用户落盘，容器内是 root，需显式放行归属
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A x86_64 aarch64_generic
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: publish packages from ${GITHUB_SHA::7}"
            git push
          fi
