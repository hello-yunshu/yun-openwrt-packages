name: Build unified OpenWrt feed candidate

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Build only packages with immutable source locks, or require the entire supported package matrix.
        required: true
        type: choice
        options:
          - available-only
          - all-required
        default: available-only
      publish:
        description: Deploy the candidate to GitHub Pages after every qualification and signature gate passes.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: yun-feed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      runtime_matrix: ${{ steps.matrix.outputs.runtime_matrix }}
      runtime_count: ${{ steps.matrix.outputs.runtime_count }}
      index_matrix: ${{ steps.matrix.outputs.index_matrix }}
      packages: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate support and immutable source locks
        id: matrix
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/validate_mainstream_support.py
          python3 scripts/build_matrix.py --scope "$SCOPE" --github-output "$GITHUB_OUTPUT"

  build-package:
    name: ${{ matrix.package }} / ${{ matrix.openwrtVersion }} / ${{ matrix.packageArch }}
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.sdkTag }}
      options: --user root
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare OpenWrt feeds
        working-directory: /builder
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base rust
      - name: Fetch and verify package source commit
        working-directory: /builder
        env:
          PKG_REPOSITORY: ${{ matrix.repository }}
          PKG_REF: ${{ matrix.sourceRef }}
          PKG_SOURCE_PATH: ${{ matrix.sourcePath }}
          PKG_NAME: ${{ matrix.package }}
          EXPECTED_PACKAGE_VERSION: ${{ matrix.expectedPackageVersion }}
          RILL_SOURCE_COMMIT: ${{ matrix.rillSourceCommit }}
        run: |
          set -euo pipefail
          [[ "$PKG_REF" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p package/"$PKG_NAME"
          git -c init.defaultBranch=main init -q /tmp/pkg-src
          git -C /tmp/pkg-src remote add origin "$PKG_REPOSITORY"
          git -C /tmp/pkg-src fetch -q --depth 1 origin "$PKG_REF"
          git -C /tmp/pkg-src checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/pkg-src rev-parse HEAD)" = "$PKG_REF"
          cp -a "/tmp/pkg-src/$PKG_SOURCE_PATH/." "package/$PKG_NAME/"
          test -f "package/$PKG_NAME/Makefile"
          if [ -n "$EXPECTED_PACKAGE_VERSION" ]; then
            source_version=$(sed -n 's/^PKG_VERSION:=//p' "package/$PKG_NAME/Makefile" | head -n1)
            test "$source_version" = "$EXPECTED_PACKAGE_VERSION"
          fi
          if [[ "$PKG_NAME" == "luci-app-performance-manager-all" ]]; then
            # The single user package Makefile consumes source files from the
            # old repository layout. Stage those data directories only; do
            # not copy any split-package Makefile or build recipe.
            mkdir -p package/luci-app-performance-manager package/performance-manager/files package/performance-manager-rill/files
            for subtree in htdocs po root; do
              test -d "/tmp/pkg-src/package/luci-app-performance-manager/$subtree"
              cp -a "/tmp/pkg-src/package/luci-app-performance-manager/$subtree" package/luci-app-performance-manager/
            done
            cp -a /tmp/pkg-src/package/performance-manager/files/. package/performance-manager/files/
            cp -a /tmp/pkg-src/package/performance-manager-rill/files/. package/performance-manager-rill/files/
            test ! -e package/luci-app-performance-manager/Makefile
            test ! -e package/performance-manager/Makefile
            test ! -e package/performance-manager-rill/Makefile
            for required in \
              package/luci-app-performance-manager/po/zh_Hans/performance-manager.po \
              package/luci-app-performance-manager/htdocs/luci-static/resources/performance-manager/ui.js \
              package/luci-app-performance-manager/root/usr/share/rpcd/acl.d/luci-app-performance-manager.json \
              package/performance-manager/files/etc/init.d/performance-manager \
              package/performance-manager/files/usr/sbin/performance-manager.uc \
              package/performance-manager-rill/files/lib/upgrade/keep.d/performance-manager-rill; do
              test -f "$required"
            done
          fi
          if [[ "$PKG_NAME" == "luci-app-cloudflare-ip" || "$PKG_NAME" == "luci-app-performance-manager-all" ]]; then
            [[ "$RILL_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git -c init.defaultBranch=main init -q /tmp/rill-src
            git -C /tmp/rill-src remote add origin https://github.com/hello-yunshu/rill-openwrt-packages.git
            git -C /tmp/rill-src fetch -q --depth 1 origin "$RILL_SOURCE_COMMIT"
            git -C /tmp/rill-src checkout -q --detach FETCH_HEAD
            test "$(git -C /tmp/rill-src rev-parse HEAD)" = "$RILL_SOURCE_COMMIT"
            mkdir -p package/rill-runtime-manager
            cp -a /tmp/rill-src/package/rill-runtime-manager/. package/rill-runtime-manager/
            if [[ "$PKG_NAME" == "luci-app-performance-manager-all" ]]; then
              mkdir -p package/rill-runtime
              cp -a /tmp/rill-src/package/rill-runtime/. package/rill-runtime/
            else
              # The CFI recipe also defines a deprecated, empty
              # luci-app-cloudflare-ip-rill compatibility stub that depends on
              # rill-runtime. The feed publishes the base package; the Runtime
              # itself is imported from qualified release artifacts in its own
              # matrix rows. Use a build-only provider so the stub can resolve
              # its static dependency on every supported architecture,
              # including mipsel, which has no qualified Rust target.
              mkdir -p package/rill-runtime
              cat > package/rill-runtime/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk
          PKG_NAME:=rill-runtime
          PKG_VERSION:=0
          PKG_RELEASE:=1
          include $(INCLUDE_DIR)/package.mk
          define Package/rill-runtime
            SECTION:=utils
            CATEGORY:=Utilities
            TITLE:=Build-only Rill Runtime provider for the CFI compatibility stub
            PKGARCH:=all
          endef
          define Build/Compile
          endef
          define Package/rill-runtime/install
          	:
          endef
          $(eval $(call BuildPackage,rill-runtime))
          EOF
            fi
          fi
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE|PKGARCH):=' "package/$PKG_NAME/Makefile" || true
      - name: Prepare Rust toolchain for the Rill runtime dependency
        if: ${{ matrix.package == 'luci-app-performance-manager-all' }}
        working-directory: /tmp/rill-src
        env:
          RUST_TARGET: ${{ matrix.rustTarget }}
          RUST_STAGING_DIR: /builder/staging_dir/host
        run: |
          set -euo pipefail
          test -n "$RUST_TARGET"
          GITHUB_WORKSPACE=/tmp/rill-src ./scripts/prepare_rust_toolchain.sh
      - name: Prepare APK signing key
        if: ${{ matrix.packageFormat == 'apk' }}
        working-directory: /builder
        env:
          APK_PRIVATE_KEY_BASE64: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APK_PRIVATE_KEY_BASE64"
          printf '%s' "$APK_PRIVATE_KEY_BASE64" | base64 -d > private-key.pem
          chmod 600 private-key.pem
          test -s private-key.pem
          head -1 private-key.pem | grep -q 'BEGIN .*PRIVATE KEY'
          test -s "$GITHUB_WORKSPACE/keys/yun-feed.rsa.pub"
      - name: Enable APK package signing
        if: ${{ matrix.packageFormat == 'apk' }}
        working-directory: /builder
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('include/package-pack.mk')
          source = path.read_text()
          needle = '\t  --files "$$(IDIR_$(1))" \\\n'
          if 'private-key.pem' not in source:
              if needle not in source:
                  raise SystemExit('cannot locate apk mkpkg --files line')
              source = source.replace(needle, needle + '\t  --sign "$(TOPDIR)/private-key.pem" \\\n', 1)
              path.write_text(source)
          PY
      - name: Configure and build package
        working-directory: /builder
        env:
          PKG_NAME: ${{ matrix.package }}
        run: |
          set -euo pipefail
          echo "CONFIG_PACKAGE_${PKG_NAME}=y" >> .config
          make defconfig </dev/null
          make package/feeds/luci/luci-base/host/compile V=s -j"$(nproc)" </dev/null
          make "package/${PKG_NAME}/compile" V=s -j"$(nproc)" </dev/null
      - name: Verify and collect exact package artifact
        working-directory: /builder
        env:
          PKG_NAME: ${{ matrix.package }}
          PKG_FORMAT: ${{ matrix.packageFormat }}
          OPENWRT_VERSION: ${{ matrix.openwrtVersion }}
          PACKAGE_ARCH: ${{ matrix.packageArch }}
          OPENWRT_TARGET: ${{ matrix.target }}
          OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
          SDK_TAG: ${{ matrix.sdkTag }}
          SOURCE_REF: ${{ matrix.sourceRef }}
          EXPECTED_PACKAGE_VERSION: ${{ matrix.expectedPackageVersion }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_PACKAGE_VERSION"
          # Bind the selection to the exact package version so optional
          # compatibility subpackages (for example the empty CFI -rill stub)
          # can never be mistaken for the published package.
          if [ "$PKG_FORMAT" = ipk ]; then
            package_pattern="${PKG_NAME}_${EXPECTED_PACKAGE_VERSION}"'*.ipk'
          else
            package_pattern="${PKG_NAME}-${EXPECTED_PACKAGE_VERSION}"'*.apk'
          fi
          mapfile -t packages < <(find bin/packages -type f -name "$package_pattern" -print | sort)
          test "${#packages[@]}" -eq 1
          if [ -n "$EXPECTED_PACKAGE_VERSION" ]; then
            package_file=$(basename "${packages[0]}")
            case "$PKG_FORMAT" in
              ipk) [[ "$package_file" == "${PKG_NAME}_${EXPECTED_PACKAGE_VERSION}_"*".ipk" || "$package_file" == "${PKG_NAME}_${EXPECTED_PACKAGE_VERSION}-r"*".ipk" ]] ;;
              apk) [[ "$package_file" == "${PKG_NAME}-${EXPECTED_PACKAGE_VERSION}.apk" || "$package_file" == "${PKG_NAME}-${EXPECTED_PACKAGE_VERSION}-r"*".apk" ]] ;;
              *) exit 1 ;;
            esac
          fi
          output="$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH"
          mkdir -p "$output"
          cp "${packages[0]}" "$output/"
          if [ "$PKG_FORMAT" = apk ]; then
            test -x staging_dir/host/bin/apk
            staging_dir/host/bin/apk --keys-dir "$GITHUB_WORKSPACE/keys" verify "$output/$(basename "${packages[0]}")"
          fi
          PACKAGE_SHA256=$(sha256sum "$output/$(basename "${packages[0]}")" | awk '{print $1}')
          export PKG_NAME PKG_FORMAT OPENWRT_VERSION PACKAGE_ARCH OPENWRT_TARGET OPENWRT_SUBTARGET SDK_TAG SOURCE_REF PACKAGE_SHA256 EXPECTED_PACKAGE_VERSION
          python3 - <<'PY'
          import json, os
          evidence = {
              "package": os.environ["PKG_NAME"],
              "openwrtVersion": os.environ["OPENWRT_VERSION"],
              "packageFormat": os.environ["PKG_FORMAT"],
              "packageArch": os.environ["PACKAGE_ARCH"],
              "target": os.environ["OPENWRT_TARGET"],
              "subtarget": os.environ["OPENWRT_SUBTARGET"],
              "sdkTag": os.environ["SDK_TAG"],
              "sourceRef": os.environ["SOURCE_REF"],
              "packageVersion": os.environ.get("EXPECTED_PACKAGE_VERSION", ""),
              "packageSha256": os.environ["PACKAGE_SHA256"],
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "out", evidence["openwrtVersion"], evidence["packageArch"], evidence["package"] + ".build-evidence.json"), "w") as stream:
              json.dump(evidence, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pkg-${{ matrix.openwrtVersion }}-${{ matrix.packageArch }}-${{ matrix.package }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

  import-rill-runtime:
    name: Import qualified Rill Stable / ${{ matrix.openwrtVersion }} / ${{ matrix.packageArch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.runtime_count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.runtime_matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download and verify exact Rill release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.sourceRef }}
          OPENWRT_VERSION: ${{ matrix.openwrtVersion }}
          PACKAGE_ARCH: ${{ matrix.packageArch }}
          PACKAGE_FORMAT: ${{ matrix.packageFormat }}
          OPENWRT_TARGET: ${{ matrix.target }}
          OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
          SDK_TAG: ${{ matrix.sdkTag }}
        run: |
          set -euo pipefail
          lock=metadata/source-lock.json
          RILL_REPOSITORY_URL=$(jq -r '.rillRuntime.repository // empty' "$lock")
          RILL_RELEASE_ID=$(jq -r '.rillRuntime.releaseId // empty' "$lock")
          RILL_QUALIFICATION_SHA256=$(jq -r '.rillRuntime.qualificationSha256 // empty' "$lock")
          RILL_SHA256SUMS_SHA256=$(jq -r '.rillRuntime.sha256SumsSha256 // empty' "$lock")
          RILL_SOURCE_COMMIT=$(jq -r '.rillRuntime.packageCommit // empty' "$lock")
          RILL_PACKAGE_VERSION=$(jq -r '.rillRuntime.packageVersion // empty' "$lock")
          RELEASE_TAG=$(jq -r '.rillRuntime.releaseTag // empty' "$lock")
          test "$RILL_REPOSITORY_URL" = https://github.com/hello-yunshu/rill-openwrt-packages
          RILL_REPOSITORY=hello-yunshu/rill-openwrt-packages
          test -n "$RILL_RELEASE_ID" -a -n "$RILL_QUALIFICATION_SHA256" -a -n "$RILL_SHA256SUMS_SHA256" -a -n "$RILL_SOURCE_COMMIT" -a -n "$RILL_PACKAGE_VERSION" -a -n "$RELEASE_TAG"
          actual_id=$(gh release view "$RELEASE_TAG" --repo "$RILL_REPOSITORY" --json databaseId --jq .databaseId)
          test "$actual_id" = "$RILL_RELEASE_ID"
          mkdir -p "$RUNNER_TEMP/rill-release"
          gh release download "$RELEASE_TAG" --repo "$RILL_REPOSITORY" \
            --pattern '*.ipk' --pattern '*.apk' --pattern 'SHA256SUMS' --pattern 'qualification.json' \
            --dir "$RUNNER_TEMP/rill-release"
          verification=$(python3 scripts/verify_rill_release.py "$RUNNER_TEMP/rill-release" \
            --tag "$RELEASE_TAG" --release-id "$RILL_RELEASE_ID" \
            --qualification-sha256 "$RILL_QUALIFICATION_SHA256" \
            --sha256-sums-sha256 "$RILL_SHA256SUMS_SHA256" \
            --source-commit "$RILL_SOURCE_COMMIT")
          ext="$PACKAGE_FORMAT"
          filename="rill-runtime-v${OPENWRT_VERSION}-${PACKAGE_ARCH}.${ext}"
          qualified_asset=$(jq -er --arg version "$OPENWRT_VERSION" --arg arch "$PACKAGE_ARCH" --arg format "$PACKAGE_FORMAT" \
            '[.targets[] | select(.openwrtVersion == $version and .packageArch == $arch and .pkgtype == $format)] | if length == 1 then .[0].artifact else error("missing or duplicate stable target") end' \
            "$RUNNER_TEMP/rill-release/qualification.json")
          test -s "$RUNNER_TEMP/rill-release/$qualified_asset"
          mkdir -p "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH"
          cp "$RUNNER_TEMP/rill-release/$qualified_asset" "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH/$filename"
          cp "$RUNNER_TEMP/rill-release/qualification.json" "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH/rill-runtime.qualification.json"
          cp "$RUNNER_TEMP/rill-release/SHA256SUMS" "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH/rill-runtime.SHA256SUMS"
          package_sha=$(sha256sum "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH/$filename" | awk '{print $1}')
          jq -n \
            --arg package rill-runtime \
            --arg openwrtVersion "$OPENWRT_VERSION" \
            --arg packageFormat "$PACKAGE_FORMAT" \
            --arg packageArch "$PACKAGE_ARCH" \
            --arg target "$OPENWRT_TARGET" \
            --arg subtarget "$OPENWRT_SUBTARGET" \
            --arg sdkTag "$SDK_TAG" \
            --arg sourceRef "$RELEASE_TAG" \
            --arg sourceCommit "$RILL_SOURCE_COMMIT" \
            --arg packageVersion "$RILL_PACKAGE_VERSION" \
            --arg packageSha256 "$package_sha" \
            --arg qualificationSha256 "$RILL_QUALIFICATION_SHA256" \
            --arg releaseId "$RILL_RELEASE_ID" \
            --argjson verification "$verification" \
            '{package:$package,openwrtVersion:$openwrtVersion,packageFormat:$packageFormat,packageArch:$packageArch,target:$target,subtarget:$subtarget,sdkTag:$sdkTag,sourceRef:$sourceRef,sourceCommit:$sourceCommit,packageVersion:$packageVersion,packageSha256:$packageSha256,qualificationSha256:$qualificationSha256,releaseId:$releaseId,rillVerification:$verification}' \
            > "$RUNNER_TEMP/out/$OPENWRT_VERSION/$PACKAGE_ARCH/rill-runtime.build-evidence.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pkg-${{ matrix.openwrtVersion }}-${{ matrix.packageArch }}-rill-runtime
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30

  stage-candidate:
    name: Stage complete candidate for selected scope
    needs: [prepare, build-package, import-rill-runtime]
    if: >-
      always() && needs.prepare.result == 'success' && needs.build-package.result == 'success' &&
      (needs.import-rill-runtime.result == 'success' || needs.import-rill-runtime.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pkg-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Validate complete artifact set and stage versioned tree
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          python3 scripts/assemble_feed.py "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/candidate" --packages "$PACKAGES"
          cp metadata/mainstream-support.json "$RUNNER_TEMP/candidate/support-matrix.json"
          cp metadata/source-lock.json "$RUNNER_TEMP/candidate/source-lock.json"
          cat "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

  build-indexes:
    name: Sign ${{ matrix.openwrtVersion }} / ${{ matrix.packageArch }} index
    needs: [prepare, stage-candidate]
    if: ${{ needs.stage-candidate.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.index_matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.sdkTag }}
      options: --user root
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: feed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Rebuild and sign package index
        env:
          OPENWRT_VERSION: ${{ matrix.openwrtVersion }}
          PACKAGE_ARCH: ${{ matrix.packageArch }}
          PACKAGE_FORMAT: ${{ matrix.packageFormat }}
          APK_PRIVATE_KEY_BASE64: ${{ secrets.APK_PRIVATE_KEY }}
          IPK_PRIVATE_KEY: ${{ secrets.YUN_OPENWRT_IPK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          leaf="$RUNNER_TEMP/candidate/$OPENWRT_VERSION/$PACKAGE_ARCH"
          test -d "$leaf"
          if [ "$PACKAGE_FORMAT" = ipk ]; then
            test -n "$IPK_PRIVATE_KEY"
            key="$RUNNER_TEMP/yun-ipk.sec"
            printf '%s' "$IPK_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            mkhash="$RUNNER_TEMP/openwrt-mkhash"
            cat > "$mkhash" <<'EOF'
          #!/bin/sh
          set -eu
          test "$1" = sha256
          sha256sum "$2" | awk '{print $1}'
          EOF
            chmod +x "$mkhash"
            (
              cd "$leaf"
              MKHASH="$mkhash" /builder/scripts/ipkg-make-index.sh . > Packages.manifest
              grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' Packages.manifest > Packages
              gzip -9nc Packages > Packages.gz
              gzip -dc Packages.gz | cmp - Packages
              /builder/staging_dir/host/bin/usign -S -m Packages.gz -s "$key" -x Packages.sig
              /builder/staging_dir/host/bin/usign -V -m Packages.gz -p "$GITHUB_WORKSPACE/keys/yun-openwrt-feed-usign.pub" -x Packages.sig -q
              /builder/staging_dir/host/bin/usign -F -p "$GITHUB_WORKSPACE/keys/yun-openwrt-feed-usign.pub" | grep -Fx 'e58db45ab792599d'
            )
          elif [ "$PACKAGE_FORMAT" = apk ]; then
            test -n "$APK_PRIVATE_KEY_BASE64"
            key="$RUNNER_TEMP/yun-apk.pem"
            printf '%s' "$APK_PRIVATE_KEY_BASE64" | base64 -d > "$key"
            chmod 600 "$key"
            openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/yun-apk.pub"
            cmp -s "$RUNNER_TEMP/yun-apk.pub" keys/yun-feed.rsa.pub
            mkdir -p "$RUNNER_TEMP/apk-keys"
            cp keys/yun-feed.rsa.pub "$RUNNER_TEMP/apk-keys/"
            (
              cd "$leaf"
              /builder/staging_dir/host/bin/apk mkndx --allow-untrusted \
                --keys-dir "$RUNNER_TEMP/apk-keys" --sign "$key" \
                --output packages.adb ./*.apk
            )
            test -s "$leaf/packages.adb"
            verify_root="$RUNNER_TEMP/apk-verify-root"
            mkdir -p "$verify_root/lib/apk/db" "$verify_root/etc/apk"
            : >"$verify_root/lib/apk/db/installed.adb"
            : >"$verify_root/etc/apk/world"
            /builder/staging_dir/host/bin/apk \
              --root "$verify_root" \
              --keys-dir "$RUNNER_TEMP/apk-keys" \
              --repositories-file /dev/null \
              --repository "file://$leaf/packages.adb" update
          else
            echo "unsupported package format: $PACKAGE_FORMAT" >&2
            exit 1
          fi
          sha256sum "$leaf"/* > "$leaf/SHA256SUMS"
          indexed="$RUNNER_TEMP/indexed/$OPENWRT_VERSION/$PACKAGE_ARCH"
          mkdir -p "$indexed"
          cp -a "$leaf/." "$indexed/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: indexed-${{ matrix.openwrtVersion }}-${{ matrix.packageArch }}
          path: ${{ runner.temp }}/indexed
          if-no-files-found: error
          retention-days: 30

  pages-artifact:
    name: Assemble downloadable versioned Pages artifact
    needs: [prepare, stage-candidate, build-indexes]
    if: >-
      always() && needs.prepare.result == 'success' && needs.stage-candidate.result == 'success' &&
      needs.build-indexes.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      publishable: ${{ steps.gate.outputs.publishable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: indexed-*
          path: ${{ runner.temp }}/indexed
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: feed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
      - name: Construct Pages root and evaluate qualification gate
        id: gate
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a "$RUNNER_TEMP/indexed/." site/
          cp "$RUNNER_TEMP/candidate/candidate.json" site/candidate.json
          cp "$RUNNER_TEMP/candidate/support-matrix.json" site/support-matrix.json
          cp "$RUNNER_TEMP/candidate/source-lock.json" site/source-lock.json
          touch site/.nojekyll
          mkdir -p site/keys
          cp keys/yun-feed.rsa.pub keys/yun-openwrt-feed-usign.pub site/keys/
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidate=json.loads(Path('site/candidate.json').read_text())
          publishable=(candidate.get('publishable') is True and candidate.get('status')=='publishable-candidate')
          print('publishable=' + ('true' if publishable else 'false'))
          PY
          publishable=$(python3 -c "import json; print(str(json.load(open('site/candidate.json')).get('publishable') is True).lower())")
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"
          cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Yun OpenWrt Packages</title>
          <h1>Yun OpenWrt Packages</h1>
          <p>Version-scoped signed feed. Check <a href="support-matrix.json">support-matrix.json</a> for the exact package, OpenWrt release, and architecture qualification level, and <a href="candidate.json">candidate.json</a> for this feed's qualification summary.</p>
          <p><code>build-install-qualified</code> covers build, signing, dependency resolution, clean installation, and upgrade checks. It does not claim device-side application Runtime behavior; that requires <code>device-runtime-qualified</code>.</p>
          <p>This Pages artifact is a candidate until the repository deployment gate is explicitly approved.</p>
          EOF
          (cd site && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > site/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yun-openwrt-pages-candidate-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy-pages:
    name: Deploy reviewed complete feed to Pages
    needs: pages-artifact
    if: ${{ inputs.publish == true && needs.pages-artifact.outputs.publishable == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
