name: build-packages

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE: "25.12.0"
  PKG_REPO: https://github.com/hello-yunshu/luci-app-upnp-nat-relay.git
  PKG_NAME: luci-app-upnp-nat-relay

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
            sdk: openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: 9f371906ce6d2f95418f69fac06df58bf9df0ffc4abed6206c30f1b547fcfc12
          - arch: aarch64_generic
            target: rockchip/armv8
            sdk: openwrt-sdk-25.12.0-rockchip-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: 8775b11b55bbc139af92abf692ea5248dfa364581fa0e97ee79f66ff24ce2c4d
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file libelf-dev zstd wget

      - name: Fetch and verify SDK
        run: |
          cd "$RUNNER_TEMP"
          curl -fLO "https://downloads.openwrt.org/releases/${{ env.RELEASE }}/targets/${{ matrix.target }}/${{ matrix.sdk }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.sdk }}" | sha256sum -c -
          tar --zstd -xf "${{ matrix.sdk }}"
          SDK=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
          test -n "$SDK"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          ls -l "$SDK/staging_dir/host/bin/apk"

      - name: Install feeds and package sources
        run: |
          cd "$SDK"
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages -p luci
          git clone --depth 1 "$PKG_REPO" "$RUNNER_TEMP/src"
          rm -rf "package/$PKG_NAME"
          cp -r "$RUNNER_TEMP/src/package/$PKG_NAME" "package/$PKG_NAME"
          test -f "package/$PKG_NAME/Makefile"

      - name: Prepare signing keys
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          cd "$SDK"
          printf '%s' "$APK_PRIVATE_KEY" | base64 -d > private-key.pem
          chmod 600 private-key.pem
          test -s private-key.pem
          head -1 private-key.pem | grep -q 'BEGIN .*PRIVATE KEY'
          mkdir -p "$RUNNER_TEMP/keys"
          cp "$GITHUB_WORKSPACE/keys/yun-feed.rsa.pub" "$RUNNER_TEMP/keys/yun-feed.rsa.pub"
          grep -q 'BEGIN PUBLIC KEY' "$RUNNER_TEMP/keys/yun-feed.rsa.pub"
          echo "private key bytes: $(wc -c < private-key.pem)"

      - name: Configure
        run: |
          cd "$SDK"
          make defconfig </dev/null

      - name: Enable per-package signing
        run: |
          cd "$SDK"
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path('include/package-pack.mk')
          s = p.read_text()
          needle = '\t  --files "$$(IDIR_$(1))" \\\n'
          if needle not in s:
              sys.exit('package-pack.mk: mkpkg --files line not found')
          if 'private-key.pem' in s:
              sys.exit('package-pack.mk: already patched')
          s = s.replace(needle, needle + '\t  --sign "$(TOPDIR)/private-key.pem" \\\n', 1)
          p.write_text(s)
          PY
          grep -n -B1 -A1 'private-key.pem' include/package-pack.mk

      - name: Build po2lmo host tool
        run: |
          cd "$SDK"
          make package/feeds/luci/luci-base/host/compile V=s -j"$(nproc)" </dev/null
          test -x staging_dir/hostpkg/bin/po2lmo
          echo "po2lmo OK: $(staging_dir/hostpkg/bin/po2lmo 2>&1 | head -1)"

      - name: Build package
        run: |
          cd "$SDK"
          make "package/$PKG_NAME/compile" V=s -j"$(nproc)" </dev/null

      - name: Verify lmo inside staged package tree
        run: |
          cd "$SDK"
          set -e
          LMO=$(find build_dir -path "*$PKG_NAME*" -name '*.lmo')
          echo "$LMO"
          test -n "$LMO"
          find build_dir -path "*$PKG_NAME*ipkg*" -type d -name i18n -exec ls -l {} \;

      - name: Verify signatures and build index
        run: |
          cd "$SDK"
          set -e
          APK_BIN=staging_dir/host/bin/apk
          test -x "$APK_BIN"
          OUT="$RUNNER_TEMP/out/${{ matrix.arch }}"
          mkdir -p "$OUT"
          find bin/packages -name '*.apk' -exec cp -v {} "$OUT/" \;
          test -n "$(ls "$OUT"/*.apk)"
          for f in "$OUT"/*.apk; do
            "$APK_BIN" --keys-dir "$RUNNER_TEMP/keys" verify "$f"
          done
          "$APK_BIN" mkndx --allow-untrusted --keys-dir "$RUNNER_TEMP/keys" \
            --sign-key private-key.pem \
            --output "$OUT/packages.adb" "$OUT"/*.apk
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pkgs-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Commit published packages
        run: |
          set -e
          cp -rv "$RUNNER_TEMP"/artifacts/. .
          ls -l x86_64 aarch64_generic
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A x86_64 aarch64_generic
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: publish packages from ${GITHUB_SHA::7}"
            git push
          fi
