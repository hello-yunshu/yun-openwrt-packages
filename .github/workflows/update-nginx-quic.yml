name: Track nginx stable release for nginx-quic

on:
  schedule:
    # Daily at 04:23 UTC
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nginx-quic-version-track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Detect latest nginx stable and update Makefile + source-lock
        id: track
        run: |
          set -euo pipefail

          MAKEFILE="local-packages/nginx-quic/Makefile"
          LOCK="metadata/source-lock.json"
          test -f "$MAKEFILE"
          test -f "$LOCK"

          current_version=$(sed -n 's/^PKG_VERSION:=//p' "$MAKEFILE" | head -1)
          echo "Current version: $current_version"

          # nginx stable = even minor version (1.28, 1.30, …)
          # Parse the download page for all versions, filter stable
          all_versions=$(curl -fsSL --retry 3 "https://nginx.org/en/download.html" \
            | grep -oE 'nginx-[0-9]+\.[0-9]+\.[0-9]+' \
            | sed 's/nginx-//' | sort -uV)
          latest_stable=$(echo "$all_versions" \
            | awk -F. '{ if ($2 % 2 == 0) print }' | sort -V | tail -1)

          if [ -z "$latest_stable" ]; then
            echo "Cannot determine latest stable version" >&2
            exit 1
          fi
          echo "Latest stable: $latest_stable"

          if [ "$latest_stable" = "$current_version" ]; then
            echo "Already on the latest stable ($current_version); nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Download tarball and compute hash
          tarball="nginx-${latest_stable}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$tarball" \
            "https://nginx.org/download/$tarball"
          new_hash=$(sha256sum "/tmp/$tarball" | awk '{print $1}')
          echo "New hash: $new_hash"

          # Update Makefile
          sed -i \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${latest_stable}/" \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=${new_hash}/" \
            "$MAKEFILE"

          # Verify the update
          grep -q "PKG_VERSION:=${latest_stable}" "$MAKEFILE"
          grep -q "PKG_HASH:=${new_hash}" "$MAKEFILE"
          echo "Makefile updated to ${latest_stable}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest_stable" >> "$GITHUB_OUTPUT"
          echo "hash=$new_hash" >> "$GITHUB_OUTPUT"

      - name: Commit Makefile update and refresh source-lock ref
        if: ${{ steps.track.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Commit the Makefile change first
          git add local-packages/nginx-quic/Makefile
          git commit -m "chore(nginx-quic): track nginx ${{ steps.track.outputs.version }} stable"
          new_ref=$(git rev-parse HEAD)

          # Update source-lock with the new commit ref and version
          python3 - <<PYEOF
          import json
          from pathlib import Path
          lock_path = Path("metadata/source-lock.json")
          lock = json.loads(lock_path.read_text())
          entry = lock["packages"]["nginx-quic"]
          entry["ref"] = "$new_ref"
          entry["packageVersion"] = "${{ steps.track.outputs.version }}"
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + "\n")
          print(f"source-lock ref updated to {$new_ref}")
          PYEOF

          git add metadata/source-lock.json
          git commit -m "chore(feed): lock nginx-quic source ref for ${{ steps.track.outputs.version }}"
          git push origin HEAD:main

          echo "Pushed nginx-quic ${{ steps.track.outputs.version }} with ref $new_ref"
