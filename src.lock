# src.lock — 上游来源与版本锁定
#
# 用途：记录每个包对应的上游仓库与固定 commit，使构建可复现。
# 格式：<包名> <来源类型> <仓库 URL> <commit SHA> <PKG_VERSION-rRELEASE>
# 规则：
#   - ref 一律写完整 commit SHA，不写分支名或 tag（上游可能移动）
#   - 每次重新编包都要更新本文件，并与 packages.adb 同一次提交
#
# 当前已发布（x86_64 与 aarch64_generic 两个索引，包本身为 arch: noarch）

luci-app-nginx-manager git https://github.com/hello-yunshu/luci-app-nginx-manager.git 3f3bf4dbf5d90b9c69ffb6565eea79c4205bf948 1.8.8-r1
luci-app-cloudflare-ip git https://github.com/hello-yunshu/luci-app-cloudflare-ip.git b674b6e6a2cd50e20dcbfde0d620b2de5a9b30dd 2.6.0-r13
